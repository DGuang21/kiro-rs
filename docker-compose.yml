services:
  kiro-rs:
    image: ${KIRO_RS_IMAGE:-zyphrzero/kiro-rs:latest}
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 容器时区，默认北京时间；影响用量统计"今日"切分、自动更新时间等
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "8990:8990"
    volumes:
      - ./data/:/app/config/
    restart: unless-stopped
